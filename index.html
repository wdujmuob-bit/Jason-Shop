<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Jason Shop</title>
</head>

<body style="margin:0;background:#080c17;color:white;font-family:Arial,sans-serif;">

  <div style="padding:28px 20px;">
    <small style="color:#8d98ae;">PERSONAL AI SHOPPING MANAGER</small>

    <h1 style="font-size:36px;margin:8px 0;">
      Jason Shop
    </h1>

    <p style="color:#9da7ba;">
      Your personal AI shopping command center.
    </p>

    <div style="
      margin-top:30px;
      padding:25px;
      border-radius:24px;
      background:#111827;
      border:1px solid #27324a;
    ">

      <small style="color:#8d98ae;">SAFE TO SPEND</small>

      <div style="font-size:42px;font-weight:bold;margin:10px 0;">
        ₱0
      </div>

      <div style="color:#70e3a1;">
        ● Ready for setup
      </div>

    </div>

    <button style="
      width:100%;
      margin-top:20px;
      padding:22px;
      border:0;
      border-radius:20px;
      background:#1769ff;
      color:white;
      font-size:20px;
      font-weight:bold;
    ">
      🎙️ ASK JASON
    </button>

    <h2 style="margin-top:35px;">AI Shopping Inbox</h2>

    <div style="
      padding:20px;
      background:#111827;
      border-radius:18px;
      border:1px solid #27324a;
    ">
      No shopping requests yet.
    </div>

    <h2 style="margin-top:30px;">Quick Actions</h2>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">

      <button style="padding:18px;border:0;border-radius:16px;background:#182238;color:white;">
        📷 Product
      </button>

      <button style="padding:18px;border:0;border-radius:16px;background:#182238;color:white;">
        🧾 Receipt
      </button>

      <button style="padding:18px;border:0;border-radius:16px;background:#182238;color:white;">
        🔎 Research
      </button>

      <button style="padding:18px;border:0;border-radius:16px;background:#182238;color:white;">
        💰 Budget
      </button>

    </div>

  </div>

</body>
</html>
